<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Калькулятор</title>
    <style>
        body {
            background-color: #121214;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Невеликий акуратний розмір */
        .calculator {
            width: 320px; 
            background-color: #1a1a1e;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        .display-container {
            background-color: #0f0f11;
            padding: 15px;
            border-radius: 12px;
            text-align: right;
            margin-bottom: 20px;
            min-height: 70px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }

        .history-display {
            color: #6c757d;
            font-size: 1rem;
            height: 20px;
            overflow: hidden;
            margin-bottom: 5px;
        }

        .result-display {
            color: #ffffff;
            font-size: 2.2rem; /* Акуратний шрифт */
            font-weight: bold;
            word-wrap: break-word;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        /* Невеликі зручні кнопки */
        .btn {
            padding: 15px 10px;
            font-size: 1.3rem;
            border: none;
            border-radius: 12px;
            background-color: #2a2a30;
            color: white;
            cursor: pointer;
            transition: all 0.1s ease;
        }

        .btn:hover {
            background-color: #3a3a42;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .operator {
            background-color: #2b3a4a;
            color: #00a8cc;
            font-weight: bold;
        }

        .clear {
            background-color: #4a2b2b;
            color: #ff5252;
        }

        .equal {
            background-color: #00a8cc;
            color: white;
            grid-row: span 2;
            font-size: 1.8rem;
        }

        .equal:hover {
            background-color: #00c2ee;
        }

        .zero {
            grid-column: span 2;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <div class="display-container">
            <div id="history" class="history-display"></div>
            <div id="result" class="result-display">0</div>
        </div>
        
        <div class="buttons">
            <button class="btn clear" onclick="clearScreen()">C</button>
            <button class="btn operator" onclick="appendValue('/')">÷</button>
            <button class="btn operator" onclick="appendValue('*')">×</button>
            <button class="btn operator" onclick="deleteLast()">⌫</button>

            <button class="btn" onclick="appendValue('7')">7</button>
            <button class="btn" onclick="appendValue('8')">8</button>
            <button class="btn" onclick="appendValue('9')">9</button>
            <button class="btn operator" onclick="appendValue('-')">-</button>

            <button class="btn" onclick="appendValue('4')">4</button>
            <button class="btn" onclick="appendValue('5')">5</button>
            <button class="btn" onclick="appendValue('6')">6</button>
            <button class="btn operator" onclick="appendValue('+')">+</button>

            <button class="btn" onclick="appendValue('1')">1</button>
            <button class="btn" onclick="appendValue('2')">2</button>
            <button class="btn" onclick="appendValue('3')">3</button>
            <button class="btn equal" onclick="calculate()">=</button>

            <button class="btn zero" onclick="appendValue('0')">0</button>
            <button class="btn" onclick="appendValue('.')">,</button>
        </div>
    </div>

    <script>
        let display = document.getElementById('result');
        let historyDisplay = document.getElementById('history');
        let shouldResetDisplay = false;

        function appendValue(value) {
            if (display.innerText === '0' || shouldResetDisplay) {
                display.innerText = '';
                shouldResetDisplay = false;
            }
            display.innerText += value;
        }

        function clearScreen() {
            display.innerText = '0';
            historyDisplay.innerText = '';
        }

        function deleteLast() {
            if (display.innerText.length > 1) {
                display.innerText = display.innerText.slice(0, -1);
            } else {
                display.innerText = '0';
            }
        }

        function calculate() {
            try {
                let expression = display.innerText.replace(/×/g, '*').replace(/÷/g, '/');
                if (!expression) return;
                
                historyDisplay.innerText = display.innerText + ' =';
                
                let result = new Function('return ' + expression)();
                
                if (result % 1 !== 0) {
                    result = parseFloat(result.toFixed(8));
                }
                
                display.innerText = result;
                shouldResetDisplay = true;
            } catch (error) {
                display.innerText = 'Помилка';
                shouldResetDisplay = true;
            }
        }
    </script>
</body>
</html>
